<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contador de Likes</title>

    <!-- Conectar archivo CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    
    <div class="container">

        <h1>Interactividad con el DOM</h1>

        <p>
            Haz clic en el botón para aumentar el contador
            y registrar la hora de cada clic.
        </p>

        <!-- Contador -->
        <h2 id="contador">0</h2>

        <!-- Botón -->
        <button id="btn-like">¡Haz clic aquí!</button>

        <!-- Tabla de registros -->
        <table>
            <thead>
                <tr>
                    <th>Nº Clic</th>
                    <th>Hora</th>
                </tr>
            </thead>

            <tbody id="registros">
            </tbody>
        </table>

    </div>

    <!-- Conectar archivo JavaScript -->
    <script src="script.js"></script>

</body>
</html>
